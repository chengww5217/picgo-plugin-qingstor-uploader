name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # picgo@3 的 types 要求 node >= 20.19，20 是当前的下限
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: 类型检查与编译
        run: npm run build
      - name: 单元测试
        run: npm test
      - name: 检查发布产物（dist 是否齐全、src/test 是否被排除）
        run: npm pack --dry-run
